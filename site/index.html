const $=s=>document.querySelector(s),e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const SYS="You are Peralta AI, a study assistant for community college students. Coach and explain rather than completing graded work for the student, and encourage them to verify important facts.";
const X=(bad,good)=>`<div class="xp"><div class="no"><b>Weak</b>${bad}</div><div class="yes"><b>Strong</b>${good}</div></div>`;
const MODS=[
{min:20,t:"Integrity: cheating vs. learning prompts",d:"Where help ends and dishonesty begins.",
r:"In two or three sentences, write down your own rule for when you will and won’t use AI on schoolwork. Keep it somewhere you’ll see it before your next assignment.",
try:[{t:"Sort real prompts",p:"Give me six short example prompts a college student might send an AI about an essay on the Dust Bowl. Mix them: some cheating, some disguise or plagiarism, some gray area, some learning prompts. Don’t label them. Ask me to label each one, then tell me which I got right and why."},
{t:"Turn a cheating prompt into a learning prompt",p:"I’ll give you a prompt that would be academic dishonesty. Help me rewrite it so I do the thinking and you coach me. Start by asking me what assignment I’m working on."},
{t:"Draft your instructor email",p:"Help me write a short, polite email to my instructor asking whether AI is allowed for brainstorming, for feedback on my draft, or not at all on an upcoming assignment. Ask me for the course and assignment first, then give me a draft I can edit."}],
l:`<h3>Part 1: The rule hasn’t changed</h3>
<p>Academic integrity means the work you turn in reflects your own thinking, or you are open about where help came from. That has been true for calculators, tutors, study groups, and spellcheck. AI is the newest version of an old question: <b>what counts as your own work?</b></p>
<p>Why it matters goes beyond getting caught. Assignments exist to build a skill in <i>you</i>. If AI does the building, you reach your next class, your transfer, or your job without the skill. Consequences for crossing the line range from a zero on the assignment to a failing grade or a record at the college, and rules differ by instructor. Honest students are also hurt when others cheat, because grades and recommendations mean less.</p>
<h3>Part 2: Five kinds of prompts</h3>
<p><b>1. Cheating prompts</b> hand graded work to the AI, and you submit what comes back.</p>${X("“Write my 3-page essay on the Dust Bowl.”","“Here’s my thesis on the Dust Bowl. Where is my argument weakest? Don’t rewrite it.”")}
<p><b>2. Disguise prompts</b> are plagiarism too. Rewriting copied or AI-written text so a checker won’t catch it does not make it yours. Paraphrasing a source without citing it is still plagiarism, and AI-written text submitted as yours is dishonest even when every word is new.</p>${X("“Rewrite this paragraph so it won’t get flagged.”","“Here’s my paragraph and my source. Does my paraphrase stay close to the source’s wording? Point out places I should quote or cite.”")}
<p><b>3. Gray-area prompts</b> depend on your instructor’s rules. “Write just the intro to get me started.” “Give me five sources I can cite.” “Fix the grammar in my whole paper.” For these, ask first. And if you ask for sources, verify every one, because AI can invent them.</p>
<p><b>4. Learning prompts</b> keep the thinking with you. You try first, and the AI coaches: “Quiz me on chapter 4,” “Where does my reasoning go wrong?” “Explain this a different way.”</p>${X("“Solve problem 4.”","“Here’s my solution to problem 4. Where does my reasoning go wrong? Don’t give me the answer.”")}
<p><b>5. Good prompts</b> are clear. They say what you’re working on, what you need, and what the AI should <i>not</i> do. Module 2 builds this skill.</p>
<h3>Part 3: The spectrum of use</h3>
<table><tr><th>Type of use</th><th>Example</th><th>Risk</th></tr><tr><td>Understanding</td><td>“Explain this concept another way.”</td><td>Low</td></tr><tr><td>Feedback</td><td>“What’s unclear in my draft?”</td><td>Low</td></tr><tr><td>Assistance</td><td>“Give me 10 possible thesis angles.”</td><td>Medium: ask first</td></tr><tr><td>Substitution</td><td>“Write this,” then you submit it</td><td>High</td></tr></table>
<p>Notice that the left side is where most of the learning happens, and the right side is where most of the trouble happens. They usually go together.</p>
<h3>Part 4: Real situations</h3>
<ul><li><b>Lab report:</b> you ask AI to write “just one paragraph to get started.” That’s substitution. The paragraph still isn’t yours. Write a rough version, then ask for feedback.</li>
<li><b>Spanish homework:</b> you write it, then ask AI to check it and explain your mistakes. Usually fine, but some language instructors want homework unaided, so ask.</li>
<li><b>Dense reading:</b> you ask for a summary so you can skip it. You’ll miss details and the thinking. Read first, then use AI to check what you got.</li>
<li><b>Math homework:</b> you ask AI to solve it and copy the answers. Not okay, and the exam will show it. Try first, then ask where your method went wrong.</li>
<li><b>Take-home exam:</b> pasting questions into AI is almost never allowed. Don’t, unless the instructor explicitly says you may.</li></ul>
<h3>Part 5: Habits that keep you safe</h3>
<ul><li><b>Check the rules.</b> Read the syllabus, then ask your instructor. Silence is not permission. “Nobody said I couldn’t” won’t protect you.</li>
<li><b>Try first, then ask.</b> Attempt the work, then use AI to check it.</li>
<li><b>Disclose.</b> If AI use is allowed, say how: “I used [tool] to [specific task]. I wrote the final text myself.” Be specific. Vague disclosures defeat the purpose.</li>
<li><b>Defend it.</b> Could you explain every sentence out loud without the AI? If not, you skipped the part that mattered.</li></ul>
<p><b>If you’ve already crossed a line,</b> talk to your instructor early. Coming forward before you’re asked almost always goes better than being found out, and you learn where the line is.</p>
<h3>Part 6: Excuses that don’t hold up</h3>
<ul><li>“Everyone does it.” Rules apply to you, not to everyone.</li><li>“I only changed some words.” The ideas and structure still aren’t yours.</li><li>“The detector said it’s fine.” Detectors are unreliable and have flagged honest students. A clean result proves nothing, and a flag proves nothing either.</li><li>“It’s only brainstorming.” Maybe, but check, because some assignments prohibit it.</li></ul>
<p>Don’t build your approach on fear of being caught. Build it on this: the skills you skip now are the ones missing on exam day.</p>`,
q:[{q:"Which prompt is most likely academic dishonesty?",o:["Quiz me on chapter 4, one question at a time.","Rewrite this paragraph from my source so a plagiarism checker won’t catch it.","Where is my argument weakest? Don’t rewrite it.","Explain this concept a different way."],a:1,w:"Disguising copied or AI-written text to avoid detection is dishonest."},
{q:"Your syllabus doesn’t mention AI for an essay. What should you do?",o:["Assume it’s allowed","Assume it’s banned","Ask your instructor","Use it and hope"],a:2,w:"Silence isn’t permission. A short question protects you."},
{f:1,pre:"Here’s my draft intro. Point out two unclear spots. Do not",post:"my text.",ok:"^(re-?write|write|change|edit|rephrase|replace|fix)",ex:"rewrite",w:"Telling the AI what not to do keeps you in charge of the writing."},
{q:"A student pastes an AI-written paragraph, changes a few words, and submits it as their own. What is this?",o:["Fine, because the wording is different","Still dishonest: the ideas and structure aren’t theirs, and hiding the source makes it worse","Fine as long as a detector doesn’t flag it","Only a problem if the instructor notices"],a:1,w:"Changing words doesn’t make AI-written work yours."},
{q:"What does the defend-it test ask?",o:["Whether a detector would flag your work","Whether you could explain every sentence out loud without the AI","Whether your friends used AI too","Whether the AI sounded confident"],a:1,w:"If you can’t explain it, you haven’t learned it."},
{f:1,pre:"Disclosure: I used an AI tool to",post:"practice questions from my own notes. I wrote my answers myself.",ok:"generat|creat|mak|writ|produc",ex:"generate",w:"A good disclosure says exactly what the AI did and what you did."},
{q:"You ask AI for “five sources I can cite.” What is the biggest risk?",o:["The sources may be invented, so you must verify each one","The AI will refuse","The sources will be too short","Nothing, AI sources are always real"],a:0,w:"AI can produce real-sounding sources that don’t exist."},
{q:"Which prompt is a gray area that you should ask your instructor about first?",o:["Quiz me on chapter 4.","Write just the introduction to my essay to get me started.","Explain this concept another way.","Here’s my solution. Where does my reasoning go wrong?"],a:1,w:"Asking AI to write part of graded work depends entirely on your instructor’s rules."},
{f:1,pre:"Here’s my solution to problem 4. Where does my",post:"go wrong? Don’t give me the answer.",ok:"reason|logic|work|think|method|step|approach|solution|mistake|error",ex:"reasoning",w:"You tried first, and the AI checks your thinking without replacing it."},
{q:"You realize you submitted AI-written text that your instructor didn’t allow. What’s the best move?",o:["Hope nobody notices","Delete your chat history","Talk to your instructor early and explain","Blame the AI tool"],a:2,w:"Coming forward early usually goes much better than being found out."},
{q:"Why shouldn’t your approach to AI be “avoid getting flagged by a detector”?",o:["Detectors are perfect, so there’s no way around them","Detectors are unreliable, and the real issue is whether you did the learning","Instructors never check","Detectors only work on code"],a:1,w:"The skills you skip are the ones you’ll be missing later, whatever a detector says."},
{f:1,pre:"I used AI for",post:"only. All final writing is my own.",ok:"brainstorm|feedback|idea|outline|grammar|check|study|practice|quiz|explain",ex:"brainstorming",w:"Naming the specific use is what makes a disclosure honest."}]},

{min:20,t:"How to structure a good prompt",d:"Subject and goal, limitations, re-ups, examples.",
r:"Pick a prompt you’ve sent an AI before. In two or three sentences, say which of the four pieces it was missing and how you’d rewrite it.",
try:[{t:"Prompt makeover",p:"Help me practice writing prompts. Give me one weak, vague prompt a student might send about a class topic, then ask me to rewrite it using subject and goal, limitations, and an example. Wait for my rewrite, then give me specific feedback on each piece."},
{t:"Practice re-ups",p:"Explain how cells make energy in two long, formal paragraphs. I’m going to practice giving you follow-up instructions (re-ups) to improve your answer. After your first answer, wait for me. Then follow each re-up and tell me which of my re-ups were most specific."},
{t:"Show, don’t tell",p:"I want 5 practice quiz questions on a topic I’ll name. First, ask me what topic and class. Then ask me to paste one sample question so you can match its style. Write the 5 questions in that style."}],
l:`<h3>Part 1: AI only knows what you tell it</h3>
<p>AI can’t read your mind. It sees only your words, and when you leave things out, it guesses. Most disappointing answers come from missing information, not from a bad AI. Strong prompts have four pieces. When an answer disappoints you, one of them is usually missing.</p>
<h3>Part 2: Subject and goal</h3>
<p>Say <b>what you’re working on</b> and <b>what you actually need</b>. These are different things, and people often give only the first. Use a clear verb: <i>explain, critique, compare, quiz me, outline, check, summarize</i>. “Help me with” is almost always too vague.</p>
<p>A little context about you helps a lot: your course, your level, and what you already know. “I understand X but not Y” lets the AI skip the part you have.</p>${X("“Photosynthesis.”","“I’m studying for a biology midterm. I understand the overall idea but not the light-dependent reactions. Explain those.”")}${X("“Help me with my essay.”","“I’m a first-year student writing a 4-page paper on how the Dust Bowl changed migration. Check whether my second paragraph supports my thesis.”")}
<h3>Part 3: Limitations</h3>
<p>Limitations are the constraints. If you don’t set them, the AI picks its own, and they’re rarely what you wanted.</p>
<ul><li><b>Length:</b> “under 150 words,” “three bullet points”</li><li><b>Tone:</b> “casual,” “formal,” “encouraging but honest”</li><li><b>Reading level:</b> “as if I’m new to the subject,” “no jargon”</li><li><b>Format:</b> “a table,” “numbered steps,” “one paragraph”</li><li><b>What to avoid:</b> “don’t rewrite my text,” “don’t give me the final answer”</li></ul>${X("“Explain the French Revolution.”","“Explain the main causes of the French Revolution in under 150 words, in plain language, as a bulleted list.”")}
<p>The “what to avoid” kind is an integrity tool. Telling the AI not to do your work keeps you in charge of it.</p>
<h3>Part 4: Re-ups</h3>
<p>Your first answer is a <b>draft</b>, not a verdict. A <b>re-up</b> is a follow-up that improves it. Good re-ups are specific:</p>
<ul><li><b>Point at the problem:</b> “The second point is too vague. Give a concrete example.”</li><li><b>Say what to keep:</b> “Keep the structure, but use plainer language.”</li><li><b>Redirect:</b> “Take a more skeptical tone.”</li><li><b>Ask what it needs:</b> “What information would help you give a better answer?” This is one of the most underused moves.</li></ul>
<p>If a conversation gets long and tangled and answers get worse, <b>start a fresh chat</b> with a cleaned-up prompt that carries the key context. And don’t confuse iterating with gambling. Clicking regenerate over and over until something looks good isn’t refining. It’s outsourcing your judgment.</p>
<h3>Part 5: Examples</h3>
<p>Sometimes the fastest way to explain what you want is to show it. Paste a sample flashcard, a paragraph in the tone you like, or a practice question in the style you want, and say “make 5 more like this.” You can also show a bad example: “Not like this, because it’s too wordy.” If you share your own writing as an example, make sure you’re comfortable pasting it into the tool.</p>${X("“Make flashcards that are good.”","“Here’s the style I like. Q: What does ATP do? A: Stores and transfers energy in cells. Make 10 more like this about cellular respiration.”")}
<h3>Part 6: Putting it together</h3>
<p>Here’s a prompt built with all four pieces, followed by how a re-up improves it.</p>
<div class="xp"><div class="yes"><b>First prompt</b>I’m a first-year student studying cellular respiration for a bio exam. Explain how ATP is made, in under 150 words, with no jargon, as numbered steps. Don’t include anything about photosynthesis.</div><div class="yes"><b>Re-up</b>Step 3 is still too technical. Keep the steps, but explain step 3 with a simple analogy.</div></div>
<p>A reusable template:</p><div class="xp"><div><b>Template</b>I’m a [your level] studying [topic] for [course or assignment]. I need to [verb + what you want]. Limits: [length, tone, format, what to avoid]. Example of good: [optional].</div></div>
<h3>Common mistakes</h3>
<ul><li><b>Too vague:</b> “Explain history.” What part? For what purpose?</li><li><b>Too stuffed:</b> a wall of pasted text with no clear ask. Short and specific beats long and rambling.</li><li><b>Too many tasks at once:</b> split big requests into steps.</li><li><b>Accepting the first answer</b> without checking it. See Module 3.</li></ul>`,
q:[{q:"Which piece of a prompt tells the AI the length, tone, and format?",o:["Subject and goal","Limitations","Re-ups","Examples"],a:1,w:"Constraints like length, tone, and format are limitations."},
{q:"The first answer is too vague. What’s the best next move?",o:["Regenerate until it looks good","Give up","Re-up: point to what’s vague and ask for specifics","Accept it"],a:2,w:"Specific feedback beats gambling on regeneration."},
{f:1,pre:"The second point is too vague. Give me a",post:"example.",ok:"concrete|specific|real|detailed|clear",ex:"concrete",w:"Re-ups work best when they name exactly what to fix."},
{q:"You want practice questions in a particular style. What helps most?",o:["Saying “make them good”","Pasting one sample and saying “write 5 like this”","Saying “make them hard”","Asking for more questions"],a:1,w:"Examples communicate what descriptions can’t."},
{q:"Which prompt is best structured?",o:["Help me with my bio exam.","Explain photosynthesis.","Explain photosynthesis for my bio midterm in under 150 words, no jargon, with a kitchen analogy.","Tell me everything about plants."],a:2,w:"It has a subject, a goal, and limits."},
{f:1,pre:"I’m a first-year student studying photosynthesis. Explain it in under 100",post:"with no jargon.",ok:"word|sentence|line|bullet|point",ex:"words",w:"Length is a limitation. Stating it stops the AI from guessing."},
{q:"Which is the clearest statement of a goal?",o:["Help me with biology.","Biology.","Explain the light-dependent reactions in plain language, since my textbook lost me.","Tell me everything about photosynthesis."],a:2,w:"It names the topic, the need, and the reason, with a clear verb."},
{q:"Which is an example of a tone limitation?",o:["Under 150 words","As a table","Write in a friendly, encouraging tone","Use only my notes"],a:2,w:"Tone describes how the response should sound."},
{f:1,pre:"Keep the structure, but use",post:"language.",ok:"plain|simple|simpler|casual|everyday|easy|easier|clear",ex:"plain",w:"A re-up that says what to keep and what to change gets the best results."},

{min:20,t:"AI literacy: asking well and checking answers",d:"Ask for understanding, then verify what you get.",
r:"Think of the last time you trusted an AI answer without checking. In two or three sentences, what would you check now, and where?",
try:[{t:"Teach it back",p:"I want to practice finding gaps in my understanding. Ask me which concept from one of my classes I’d like to practice. Then let me explain it in my own words, and tell me what I got wrong or left out. Don’t give me the full explanation first."},
{t:"Switch the mode",p:"Ask me for a concept I find confusing. Explain it three ways, one at a time: first in plain language, then with an analogy, then as a step-by-step walkthrough. After each, ask me whether it helped before moving on."},
{t:"Catch a hallucination",p:"Give me three academic sources on a niche topic I’ll name, with authors, titles, and years. Ask me for the topic first. After you answer, I’m going to look each one up. Then tell me honestly which details you are least sure about."}],
l:`<h3>Part 1: Ask for understanding, not just answers</h3>
<p>A definition tells you <i>what</i> something is. An explanation tells you <i>how</i> and <i>why</i>, which is what exams test. If you only ask “What is photosynthesis?” you get a tidy definition you’ll forget in two days.</p>${X("“What is supply and demand?”","“Walk me through why prices rise when demand goes up and supply stays the same, and what happens next.”")}
<p>Phrases that pull out explanations: “Walk me through why…”, “What’s the reasoning behind…?”, “What would happen if one thing changed?”, “What’s the most common misunderstanding about this?” And tell the AI what you already know (“I get X but not Y”) so it can skip what you have.</p>
<h3>Part 2: Change the mode</h3>
<p>The same idea can be explained many ways. If one form doesn’t land, ask for another.</p>
<table><tr><th>Mode</th><th>Prompt idea</th><th>Good for</th></tr><tr><td>Analogy</td><td>“Explain the immune system as a security team.”</td><td>Abstract ideas</td></tr><tr><td>Diagram in words</td><td>“Describe a diagram of the water cycle: boxes and arrows.”</td><td>Processes and systems</td></tr><tr><td>Walkthrough</td><td>“Solve this type of equation one step at a time, explaining each.”</td><td>Math and procedures</td></tr><tr><td>Worked example</td><td>“Show a worked example, then give me a similar one to try.”</td><td>Problem solving</td></tr><tr><td>Compare</td><td>“Compare mitosis and meiosis in a table.”</td><td>Easily confused ideas</td></tr></table>
<p>Notice the worked-example row ends with <i>a similar one to try</i>. Reading a solution is not the same as producing one, so always try the next problem yourself. You can also adjust the level: simpler, more technical, more concrete, or broken into three small steps.</p>
<h3>Part 3: Summarize after you read</h3>
<p>AI can turn a dense reading into something you can hold onto, but only if you read first. If you use a summary to replace the reading, you miss details and the thinking. A better routine: read, write your own short summary, then ask “What important points did I miss or get wrong?” Check any AI summary against the source, because summaries can drop key details or overstate claims. Don’t paste personal information or material you aren’t allowed to share.</p>
<h3>Part 4: Find your gaps</h3>
<p>Most students use AI to confirm what they already know. That feels good and teaches little. The real value is finding what you <i>don’t</i> know yet, before the exam does.</p>
<ul><li><b>Teach it back:</b> “I’ll explain [concept] in my own words. Tell me what I got wrong or left out.”</li><li><b>Let it question you:</b> “Ask me five questions, one at a time, to find what I don’t understand yet.”</li><li><b>Check your reasoning:</b> “Here’s how I solved this. Where does it go wrong?”</li></ul>
<p>A wrong answer found today is a point saved on the exam.</p>
<h3>Part 5: Why AI makes things up</h3>
<p>AI models don’t look facts up in a verified database. They generate text that <i>sounds likely</i>, based on patterns in their training. Usually that’s correct and useful. Sometimes it’s confident nonsense, called a <b>hallucination</b>. Their knowledge also has a cutoff date, so they may not know recent events or your specific class materials, and they can reflect biases or gaps in the data they learned from.</p>
<p>Hallucinations include fake citations with real-sounding authors and journals, wrong dates and statistics, invented quotes, and smooth explanations that are simply false. In 2023, lawyers in a New York federal case were sanctioned for submitting a brief that cited court cases an AI had made up.</p>
<p><b>Confidence is not accuracy.</b> The AI sounds just as sure when it’s wrong.</p>
<h3>Part 6: How to verify</h3>
<ol><li><b>Look up every citation.</b> If you can’t find it in your library database or Google Scholar, assume it doesn’t exist.</li><li><b>Check key facts</b> against your textbook, notes, or a reliable source.</li><li><b>Take extra care</b> with quotes, statistics, math, recent events, niche topics, and legal or medical claims.</li><li><b>Ask it to flag uncertainty,</b> then check those parts first. This helps, but it never replaces checking.</li><li><b>Don’t ask “are you sure?”</b> The AI can repeat its mistake. Look in a real source.</li></ol>
<p>Even good answers need judgment. Ask “What assumptions does this rely on?” or “What would someone who disagrees say?” to surface weak spots. You are responsible for what you submit. “The AI said it” is never an excuse.</p>
<h3>Part 7: Protect your privacy</h3>
<p>Assume conversations may be stored. Don’t paste passwords, your student ID, your address, other students’ work, or anything you wouldn’t want shared. Your own notes and your own drafts, with names removed, are generally fine, subject to your instructor’s rules.</p>`,

{min:20,t:"Studying with AI",d:"Flashcards, study guides, and quizzes.",
r:"Name your next exam or big assignment. In two or three sentences, which parts of this workflow will you use, and on which days?",
try:[{t:"Make flashcards from your notes",p:"Help me make flashcards. Ask me to paste one page of my own notes. Then make 8 flashcards using only my notes, one idea per card, formatted Q: … A: … Mix definitions with why questions. Flag anything in my notes that looks wrong or unclear."},
{t:"Build a study guide",p:"Help me build a study guide. Ask me which class and exam I’m studying for, and what format the exam has. Then ask me to paste my notes. Organize them into a one-page guide with key concepts, terms, connections, and things I should be able to explain. Flag anything unclear or missing."},
{t:"Take a quiz",p:"Quiz me to help me study. First ask which class and topic I’m studying. Then ask me questions one at a time, waiting for my answer before you reveal anything. After each answer, tell me whether I’m right and explain why. Start easy and get harder. At the end, list what I missed."}],
l:`<h3>Part 1: Why this works</h3>
<p>Rereading and highlighting feel productive, but they mostly make material feel familiar. <b>Pulling information out of your memory</b> works better, because the effort of recalling is what makes it stick. Spreading practice over several days beats cramming the night before. AI is great at making practice material. Use it to generate practice, then do the practicing yourself.</p>
<h3>Part 2: Start from your own notes</h3>
<p>The best study tools come from <b>your</b> notes, readings, and your instructor’s priorities. A generic answer may not match what your class emphasizes. Paste your notes and say “use only the material below.” That keeps results matched to your class and gives the AI less room to invent facts. Follow your instructor’s rules about course materials, and don’t paste personal information.</p>
<h3>Part 3: Flashcards</h3>
<p>Flashcards work because they force retrieval: you try to recall the answer <i>before</i> you flip the card. A good card tests one idea, with a clear question on the front and a short answer on the back.</p>${X("“Make flashcards for biology.”","“Make 10 flashcards from my notes below, one idea each. Format: Q: … A: … Use only my notes.”")}
<div class="xp"><div class="no"><b>Weak card</b>Q: Cellular respiration. A: A long paragraph covering glycolysis, the Krebs cycle, the electron transport chain, and fermentation…</div><div class="yes"><b>Strong card</b>Q: What does ATP do? A: Stores and transfers energy in cells.</div></div>
<ul><li><b>Check the cards for errors</b> before you memorize anything. Learning a wrong fact is worse than not learning it.</li><li><b>Ask for variety:</b> definitions, “why” questions, and “what would happen if” questions.</li><li><b>Use them over several days,</b> not in one marathon.</li><li><b>Make some yourself first.</b> Writing cards is part of the learning. Then ask the AI which ideas you missed.</li><li><b>Export:</b> ask for a format your flashcard app can import, such as a simple table or comma-separated list.</li></ul>
<h3>Part 4: Study guides</h3>
<p>When your notes are scattered across lectures, readings, and handouts, AI can help organize them into one guide. Tell it your exam format (“two essays and a vocabulary section”) and ask it to include key concepts, important terms, connections between ideas, and a list of things you should be able to explain. Add <b>“flag anything unclear or missing”</b>, which often reveals topics you forgot to cover.</p>
<p>Check the guide against your syllabus and your instructor’s review materials, since it is only as good as what you gave it. Then make it yours: rewrite parts in your own words, add examples, and cross out what you already know. A guide you only skim is a reading list. One you work with is a tool.</p>
<h3>Part 5: Quizzes</h3>
<p>Practice quizzes are probably the most valuable use of AI for studying, because they find your gaps <i>before</i> the real exam does.</p>
<ul><li><b>One question at a time.</b> If it gives you all the questions and answers at once, you’ll be tempted to peek.</li><li><b>Wait for your answer.</b> Commit to an answer, even a guess. That effort is the learning.</li><li><b>Explain mistakes.</b> “Explain why my answer was wrong” turns every miss into a lesson.</li><li><b>Repeat what you missed.</b> “Make a second quiz on only the questions I got wrong.”</li><li><b>Match the real exam.</b> Say whether you’ll face essays, problem sets, multiple choice, or short answers.</li></ul>${X("“Give me 10 questions and the answers.”","“Quiz me on my notes below, one question at a time. Wait for my answer, tell me if I’m right and why, then ask the next one. Start easy and get harder.”")}
<p>If the AI marks you wrong but your notes say you’re right, check your notes or textbook. You may have just caught a hallucination.</p>
<h3>Part 6: A week-before-the-exam workflow</h3>
<table><tr><th>When</th><th>What to do</th></tr><tr><td>Day 1</td><td>Gather notes. Make a study guide and check it against your syllabus.</td></tr><tr><td>Day 2</td><td>Find gaps: teach it back or let the AI question you. Fix what you find.</td></tr><tr><td>Day 3</td><td>Make flashcards from the guide and review them.</td></tr><tr><td>Day 4</td><td>Take an AI quiz. Mark every miss.</td></tr><tr><td>Day 5</td><td>Quiz yourself on only your misses. Review flashcards again.</td></tr><tr><td>Day before</td><td>One mixed quiz, a quick read of the guide, and sleep.</td></tr></table>
<p>You don’t need every step for every class. The point is a repeatable system you can adapt.</p>
<h3>Part 7: Keep it honest</h3>
<p>Everything above is generally safe, because you’re doing the thinking and AI is generating practice. Still: don’t paste real exam questions, take-home tests, or graded assignments into an AI tool unless your instructor says you may. Never use AI during an exam or quiz unless it’s explicitly allowed. And if AI is restricted in a course, follow that and use your own notes, textbook questions, and a study group instead.</p>`,

function toast(t){const o=$("#toast");o.textContent=t;o.classList.add("on");setTimeout(()=>o.classList.remove("on"),2200)}
async function cp(t){try{await navigator.clipboard.writeText(t)}catch(x){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(y){toast("Couldn’t copy");a.remove();return}a.remove()}toast("Copied")}
function md(t){return String(t).split("```").map((p,i)=>{if(i%2){const n=p.indexOf("\n");return"<pre><code>"+e((n>-1&&n<20?p.slice(n+1):p).replace(/\n$/,""))+"</code></pre>"}let h="",li=null;const cl=()=>{if(li){h+="</"+li+">";li=null}},inl=s=>e(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");p.split("\n").forEach(l=>{let m;if(m=l.match(/^(#{1,4})\s+(.*)/)){cl();const n=Math.min(m[1].length+2,5);h+=`<h${n}>${inl(m[2])}</h${n}>`}else if(m=l.match(/^\s*[-*]\s+(.*)/)){if(li!="ul"){cl();h+="<ul>";li="ul"}h+="<li>"+inl(m[1])+"</li>"}else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(li!="ol"){cl();h+="<ol>";li="ol"}h+="<li>"+inl(m[1])+"</li>"}else if(!l.trim())cl();else{cl();h+="<p>"+inl(l)+"</p>"}});cl();return h}).join("")}

function skelChat(){$("#app").innerHTML=`<div class="chat"><aside id="side"><button class="pri" data-a="new">New chat</button><div id="list"></div></aside><section id="cs"><div id="note"></div><div id="msgs" class="msgs" aria-live="polite"></div><h2 id="hello">Hello, Student!</h2><div class="comp"><textarea id="in" rows="2" placeholder="Ask about your coursework…" aria-label="Message"></textarea><button class="pri" data-a="send">Send</button></div><p class="mu sm">Enter sends, Shift+Enter adds a line. Conversations are private to you. AI can be wrong, so check important facts. Or <a href="#" data-a="tolib" style="color:var(--rd)">browse the prompt library</a>.</p></section></div>`;if(S.pre){$("#in").value=S.pre;S.pre=""}notes();drawList();drawMsgs()}

function drawList(){const l=$("#list");if(!l)return;l.innerHTML=S.chats.length?S.chats.map(c=>`<button class="ci${c.id===S.cur.id?" on":""}" data-a="open" data-i="${e(c.id)}"><span>${e(c.title)}</span><span data-a="del" data-i="${e(c.id)}" role="button" aria-label="Delete conversation">×</span></button>`).join(""):'<p class="mu sm">Your past conversations appear here.</p>'}
function drawMsgs(){const o=$("#msgs");if(!o)return;const c=S.cur,cs=$("#cs");if(cs)cs.classList.toggle("empty",!c.m.length&&!S.busy&&!S.err);let h=c.m.length||S.busy?"":'<p class="mu">Ask a question, or start from the <a href="#" data-a="tolib" style="color:var(--rd)">prompt library</a>.</p>';c.m.forEach((m,i)=>{h+=`<div class="m ${m.r}"><div class="who"><span>${m.r=="user"?"You":"Peralta AI"}</span>${m.r=="user"?"":`<button class="gh sm" data-a="copy" data-i="${i}">Copy</button>`}</div>${m.r=="user"?"<p>"+e(m.c).replace(/\n/g,"<br>")+"</p>":md(m.c)}</div>`});if(S.busy)h+=`<div class="m"><div class="who">Peralta AI</div>${c.live?md(c.live):'<span class="dots" aria-label="Thinking"><span></span><span></span><span></span></span>'}</div>`;if(S.err)h+=`<div class="m"><p class="er">${e(S.err)}</p><button class="gh" data-a="retry">Try again</button></div>`;o.innerHTML=h;o.scrollTop=o.scrollHeight}
function errMsg(x){const c=x&&x.code;if(S.local){if(c=="rate_limited")return"You’ve used today’s chat messages on this browser. They reset tomorrow. Lessons and the game still work.";if(c=="daily_cap")return"The chat has reached its limit for today. Lessons and the game still work. Try again tomorrow.";if(c=="ai_unavailable")return"The AI is busy right now. Your message is kept. Try again in a minute.";if(c=="offline")return"Couldn’t reach the AI. Check your connection and try again. Your message is kept.";if(c=="not_configured")return"Chat isn’t connected yet.";}if(c=="not_granted")return"AI access was declined for this page. Reload and allow it to chat.";if(c=="rate_limited")return"Too many requests. Wait a moment, then try again.";return"The AI request failed"+(c?" ("+c+")":"")+". Your message is kept. Try again."}
